<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>生日倒计时</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
  </head>
  <body>
    <div class="scroll-container">

      <!-- Page 1: Countdown -->
      <section class="page page-1" aria-live="polite">
        <p class="title" id="main-title">距你的生日还有</p>
        <h1 class="birthday-title" id="birthday-title">生日快乐</h1>

        <div class="countdown" id="countdown" aria-label="生日倒计时">
          <div class="time-unit">
            <span class="num" id="days">--</span>
            <span class="unit">天</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="hours">--</span>
            <span class="unit">时</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="minutes">--</span>
            <span class="unit">分</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="seconds">--</span>
            <span class="unit">秒</span>
          </div>
        </div>

        <p class="message" id="main-message"></p>

        <div class="scroll-hint" aria-hidden="true">
          <span class="scroll-hint-line"></span>
        </div>
      </section>

      <!-- Page 2: Two-column todo -->
      <section class="page page-2">
        <div class="page-2-content">
          <p class="page-label">我们想做的事</p>

          <div class="todo-columns">
            <div class="todo-col">
              <h3 class="col-name">e</h3>
              <ul class="todo-list" id="todo-list-e"></ul>
              <form class="todo-form" data-owner="e" autocomplete="off">
                <input class="todo-input" type="text" placeholder="添加…" maxlength="60" />
                <button class="todo-submit" type="submit">+</button>
              </form>
            </div>

            <div class="col-divider" aria-hidden="true"></div>

            <div class="todo-col">
              <h3 class="col-name">jerry</h3>
              <ul class="todo-list" id="todo-list-jerry"></ul>
              <form class="todo-form" data-owner="jerry" autocomplete="off">
                <input class="todo-input" type="text" placeholder="添加…" maxlength="60" />
                <button class="todo-submit" type="submit">+</button>
              </form>
            </div>
          </div>
        </div>

        <div class="scroll-hint" aria-hidden="true">
          <span class="scroll-hint-line"></span>
        </div>
      </section>

      <!-- Page 3: Gift unlock -->
      <section class="page page-3">
        <div class="page-3-content">
          <p class="page-label">礼物解锁</p>

          <div class="gifts">

            <div class="gift-card locked" id="gift-0">
              <p class="gift-num">礼物 01</p>
              <div class="gift-lock-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="1"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <p class="gift-unlock-date" id="gift-date-0">6月25日解锁</p>
              </div>
              <div class="gift-open-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 12 20 22 4 22 4 12"/>
                  <rect x="2" y="7" width="20" height="5"/>
                  <line x1="12" y1="22" x2="12" y2="7"/>
                  <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                  <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </svg>
                <p class="gift-unlocked-hint">已解锁</p>
              </div>
            </div>

            <div class="gift-card locked" id="gift-1">
              <p class="gift-num">礼物 02</p>
              <div class="gift-lock-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="1"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <p class="gift-unlock-date" id="gift-date-1">8月 · 待定解锁</p>
              </div>
              <div class="gift-open-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 12 20 22 4 22 4 12"/>
                  <rect x="2" y="7" width="20" height="5"/>
                  <line x1="12" y1="22" x2="12" y2="7"/>
                  <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                  <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </svg>
                <p class="gift-unlocked-hint">已解锁</p>
              </div>
            </div>

          </div>
        </div>
      </section>

    </div>

    <button class="sidebar-trigger" id="sidebar-trigger" aria-label="已完成">已完成</button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">已完成</span>
        <button class="sidebar-close" id="sidebar-close" aria-label="关闭">×</button>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-owner">e</p>
        <ul class="completed-list" id="completed-list-e"></ul>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-owner">jerry</p>
        <ul class="completed-list" id="completed-list-jerry"></ul>
      </div>
    </aside>

    <script type="module" src="script.js"></script>
  </body>
</html>
