<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>生日倒计时</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
  </head>
  <body>
    <div class="scroll-container">

      <!-- Page 1: Countdown -->
      <section class="page page-1" aria-live="polite">
        <p class="title" id="main-title">距你的生日还有</p>
        <h1 class="birthday-title" id="birthday-title">生日快乐</h1>

        <div class="countdown" id="countdown" aria-label="生日倒计时">
          <div class="time-unit">
            <span class="num" id="days">--</span>
            <span class="unit">天</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="hours">--</span>
            <span class="unit">时</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="minutes">--</span>
            <span class="unit">分</span>
          </div>
          <span class="sep" aria-hidden="true">·</span>
          <div class="time-unit">
            <span class="num" id="seconds">--</span>
            <span class="unit">秒</span>
          </div>
        </div>

        <p class="message" id="main-message"></p>

        <div class="scroll-hint" aria-hidden="true">
          <span class="scroll-hint-line"></span>
        </div>
      </section>

      <!-- Page 2: Chat -->
      <section class="page page-2">
        <div class="page-2-content">
          <p class="page-label">聊天</p>
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-form" id="chat-form" autocomplete="off">
            <input class="chat-input" id="chat-input" type="text" placeholder="说点什么…" maxlength="100" />
            <button class="chat-submit" type="submit">↑</button>
          </form>
        </div>
      </section>

      <!-- Page 3: Gift unlock -->
      <section class="page page-3">
        <div class="page-3-content">
          <p class="page-label">礼物解锁</p>

          <div class="gifts">

            <div class="gift-card locked" id="gift-0">
              <p class="gift-num">礼物 01</p>
              <div class="gift-lock-state">
                <svg class="gift-icon" id="gift-icon-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="1"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <p class="gift-unlock-date" id="gift-date-0">6月24日解锁</p>
                <ul class="gift-tasks" id="gift-tasks-0"></ul>
              </div>
              <div class="gift-open-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 12 20 22 4 22 4 12"/>
                  <rect x="2" y="7" width="20" height="5"/>
                  <line x1="12" y1="22" x2="12" y2="7"/>
                  <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                  <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </svg>
                <p class="gift-unlocked-hint">已解锁 🎁</p>
              </div>
            </div>

            <div class="gift-card locked" id="gift-1">
              <p class="gift-num">礼物 02</p>
              <div class="gift-lock-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="1"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <p class="gift-unlock-date" id="gift-date-1">8月 · 待定解锁</p>
              </div>
              <div class="gift-open-state">
                <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 12 20 22 4 22 4 12"/>
                  <rect x="2" y="7" width="20" height="5"/>
                  <line x1="12" y1="22" x2="12" y2="7"/>
                  <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                  <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </svg>
                <p class="gift-unlocked-hint">已解锁</p>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- Page 4: Jerry -->
      <section class="page page-jerry">
        <div class="page-jerry-content">
          <p class="page-label">阿洲</p>
          <p class="jerry-offline">您的阿洲已掉线。</p>
        </div>
      </section>

      <!-- Page 5: Photos -->
      <section class="page page-photos">
        <div class="page-photos-content">
          <p class="page-label">我们</p>
          <div class="photo-wall" id="photo-wall">
            <p class="photo-empty">还没有照片</p>
          </div>
          <p class="photo-caption">tm照片真难找，下次多拍点合照呗</p>
        </div>
      </section>

    </div>


<!-- Background music -->
    <audio id="bg-music" loop src="assets/M500002LTSgE0dvPRS.mp3"></audio>
    <button class="music-btn" id="music-btn" aria-label="音乐">
      <svg class="music-icon music-icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <svg class="music-icon music-icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop"></div>
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
      <button class="lightbox-close" id="lightbox-close" aria-label="关闭">×</button>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
